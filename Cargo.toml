[package]
name = "endfield-direct-launch"
version = "0.3.1"
edition = "2024"
description = "Endfield launcher using an unmodified official suspended parent process"
publish = false
default-run = "endfield-direct-launch"

[[bin]]
name = "endfield-direct-launch"
path = "src/main.rs"
test = false

[[bin]]
name = "process-probe"
path = "src/bin/process-probe.rs"
test = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
md-5 = "0.10"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinHttp", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
